report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/phaseimpute/releases/tag/1.1.0" target="_blank">nf-core/phaseimpute</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/phaseimpute/1.1.0/docs/output" target="_blank">documentation</a>.
report_section_order:
  project_summary:
    order: 900
  tool_accuracy:
    order: 800
  maf_spectrum_tool:
    order: 750
  samtools:
    order: 700
  bcftools:
    order: 600
  glimpse:
    order: 500
  multiqc_software_versions:
    order: 400
  nf-core-phaseimpute-methods-description:
    order: 300
  nf-core-phaseimpute-summary:
    order: 200

top_modules:
  - samtools
  - bcftools
  - glimpse

export_plots: true

disable_version_detection: true

fn_clean_trim:
  - ".panel"

extra_fn_clean_exts:
  - type: regex
    pattern: "\\.batch[0-9]+"

custom_table_header_config:
  tool_accuracy-section-plot_table:
    Mean_dosage_r2:
      format: "{:,.2f}"
    Mean_best_gt_r2:
      format: "{:,.2f}"
    Mean_nonref_discordance_pct:
      format: "{:,.2f}"